# Weekly scans (DOC-71 §5, §10). `image-scan-running` (the image tag that runs, read from the host over the Tunnel) and the
# GHCR retention cleanup are added by P1-20, when an environment runs an image.
name: weekly
on:
  schedule:
    - cron: '0 19 * * 0' # Monday 02:00 in Ho Chi Minh City
  workflow_dispatch:
permissions:
  contents: read
env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1

jobs:
  gitleaks-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks (the full history of the trunk)
        run: |
          docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --config /repo/.gitleaks.toml --redact --no-banner
