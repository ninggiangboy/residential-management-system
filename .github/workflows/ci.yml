# The pull-request and trunk pipeline (DOC-71 §2, §4). `gate` is the one required check (DR-163). The trunk is `dev`
# (DR-239). A push to `dev` is checked and built; only a push to `staging`, a fast-forward of `dev`, publishes and deploys (DR-276).
# `deploy-staging` is P1-20 and prepares the host itself (DR-273); `deploy-web-staging` and `mobile-staging` are added by P6-10.
# Actions are pinned by commit SHA with the tag in a comment (DR-95); the scanner images are pinned in `env` below and
# refreshed by hand with DOC-11 §9 (Dependabot does not read `docker run` lines).
name: ci
on:
  pull_request:
    branches: [dev] # `staging` takes no pull request: `bun run staging:push` moves it (DR-276)
  push:
    branches: [dev, staging]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  POSTGRES_IMAGE: postgres:18.6
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  SEMGREP_IMAGE: semgrep/semgrep:1.182.1

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the files of a pull request through the API
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      e2e: ${{ steps.filter.outputs.e2e }}
      # Documents only gives `false` and the code jobs skip (DR-277). A push to `staging` is always `true`: it builds the image
      # it publishes, and what it does not need to check again `trusted` decides.
      code: ${{ steps.filter.outputs.code == 'true' || github.ref == 'refs/heads/staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/paths-filter.yml

  # A push to `dev` whose tree already passed `gate` on its pull request skips the checks that would repeat (DOC-71 §4.3, DR-274), and
  # so does a push to `staging` whose commit already passed `gate` on `dev` (DR-276).
  # `ops/deploy/trusted-tree.sh` decides and never fails: anything it cannot establish is `tested=false`, and then every check runs.
  # On a pull request the job is skipped and its outputs are empty, which every `if` below reads as "not tested".
  trusted:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      tested: ${{ steps.tree.outputs.tested }}
      e2e: ${{ steps.tree.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -o pipefail
          ops/deploy/trusted-tree.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  # On a change of documents only, `verify` checks the commit messages and nothing else (DR-277): `check:commits` needs no install.
  verify:
    needs: [changes, trusted]
    if: ${{ !cancelled() && needs.trusted.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - if: env.CODE == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - if: env.CODE == 'true'
        run: bun install --frozen-lockfile
      - if: env.CODE == 'true'
        run: git diff --exit-code bun.lock
      - if: env.CODE == 'true'
        run: bun run check
      # The commit and OpenAPI checks run even when `check` failed, so a pull request sees every broken rule.
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: bun run check:commits
      # A breaking OpenAPI change against the base needs /api/v2 (DR-144, AG-26); the document exists from P1-04.
      - if: ${{ !cancelled() && github.event_name == 'pull_request' && env.CODE == 'true' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/run-if-defined.ts check:openapi P1-04

  unit:
    needs: [changes, trusted]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && needs.trusted.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # DS-05 reads the fonts with fontTools through `uv run --with` (DR-237); the test fails in CI without uv.
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: 0.13.5
          enable-cache: false
      # Every workspace's tests with lcov; a figure below its target is a warning, never a failure (DR-77).
      - run: bun run test:coverage
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  integration:
    needs: [changes, trusted]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && needs.trusted.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      APP_ENV: test
      PGPASSWORD: ci-superuser
      # `@rms/test-support` clones the template database as this superuser (DOC-88 §6).
      TEST_ADMIN_DATABASE_URL: postgres://postgres:ci-superuser@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run keys:generate # throw-away passwords, written to .env.local
      - run: bun run db:provision-ci # ops/postgres/0001-provision.sql as postgres
      - run: bun scripts/run-if-defined.ts db:migrate P1-06
      - run: bun scripts/run-if-defined.ts test:integration P1-04
      - run: bun scripts/run-if-defined.ts test:grants P1-06
      - run: bun scripts/run-if-defined.ts test:authz P1-15
      # The suite that skips without a database (`@core/db`) until P1-04 moves it to `test:integration`.
      - env:
          TEST_ADMIN_DATABASE_URL: postgres://postgres:ci-superuser@localhost:5432/postgres
        run: bun run --filter @core/db test
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authz-matrix
          path: authz-matrix.*
          retention-days: 14
          if-no-files-found: ignore

  # On a change of documents only, Gitleaks alone runs (DR-277): a document can hold a secret, and Trivy and Semgrep read code.
  security:
    needs: [changes, trusted]
    if: ${{ !cancelled() && needs.trusted.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - if: env.CODE == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - if: env.CODE == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Trivy reads the licences from node_modules.
      - if: env.CODE == 'true'
        run: bun install --frozen-lockfile
      - if: env.CODE == 'true'
        id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - if: env.CODE == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.day.outputs.date }}
          restore-keys: trivy-db-
      # Each scanner runs even when one before it failed, so a pull request sees every finding.
      - if: env.CODE == 'true'
        name: Trivy vulnerabilities (bun.lock; HIGH and CRITICAL with a fix)
        run: |
          mkdir -p ~/.cache/trivy
          docker run --rm -v "$PWD:/src:ro" -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" \
            fs --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs '**/node_modules' --no-progress /src
      - if: ${{ !cancelled() && env.CODE == 'true' }}
        name: Trivy licences (forbidden for linked packages, trivy.yaml)
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" \
            fs --config /src/trivy.yaml --scanners license --severity CRITICAL --exit-code 1 --no-progress /src
      # Trivy runs as root in its container; the cache step saves the database as the runner user.
      - if: ${{ always() && env.CODE == 'true' }}
        run: sudo chown -R "$(id -u):$(id -g)" ~/.cache/trivy
      - if: ${{ !cancelled() && env.CODE == 'true' }}
        name: Semgrep (p/default and .semgrep/rules.yml; ERROR, HIGH and CRITICAL fail)
        run: |
          docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config p/default --config .semgrep/rules.yml --metrics=off \
            --json-output=semgrep.json --text .
          blocking=$(jq '[.results[] | select(.extra.severity | IN("ERROR","HIGH","CRITICAL"))] | length' semgrep.json)
          jq -r '.results[] | "| \(.extra.severity) | `\(.check_id | split(".") | last)` | \(.path):\(.start.line) |"' semgrep.json > semgrep.md
          {
            echo "### Semgrep: $blocking blocking, $(jq '.results | length' semgrep.json) in all"
            echo
            echo "| Severity | Rule | Where |"
            echo "| --- | --- | --- |"
            cat semgrep.md
          } >> "$GITHUB_STEP_SUMMARY"
          test "$blocking" -eq 0
      - if: ${{ !cancelled() }}
        name: Gitleaks (the commits of this change)
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          # A push that creates the branch has no `before`: scan that one commit.
          case "$RANGE" in 0000000000000000000000000000000000000000..*) RANGE="-1 ${RANGE#*..}";; esac
          docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --log-opts="--no-merges $RANGE"
      - if: ${{ always() && env.CODE == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep
          path: semgrep.json
          retention-days: 14
          if-no-files-found: ignore

  # A change of documents only cannot change the image (`.dockerignore` drops `docs`; a README in a package runs nothing): no build (DR-277).
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.api
          platforms: linux/amd64
          load: true
          provenance: false
          tags: rms-api:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=rms-api
          cache-to: type=gha,mode=max,scope=rms-api
      - name: Image size
        run: |
          size=$(docker image inspect rms-api:ci --format '{{.Size}}')
          echo "### rms-api image: $((size / 1024 / 1024)) MB (planned ≤ 400 MB)" >> "$GITHUB_STEP_SUMMARY"
      - id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.day.outputs.date }}
          restore-keys: trivy-db-
      - name: Trivy image (HIGH and CRITICAL with a fix; secrets in a layer)
        run: |
          mkdir -p ~/.cache/trivy
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" \
            image --scanners vuln,secret --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --no-progress rms-api:ci
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ~/.cache/trivy
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      # The process boots with a valid configuration and no database: the ops port answers `live` and `ready` is 503
      # `degraded` (DOC-38 §5.1, DR-161, CF-03). The throw-away keys come from `keys:generate`.
      - name: Boot smoke
        run: |
          bun scripts/keys-generate.ts
          bun --env-file=.env.local -e 'for (const k of ["JWT_KEYS","QR_KEYS","OTP_HMAC_KEY","SETTINGS_ENCRYPTION_KEYS","PII_ENCRYPTION_KEYS","S3_ENDPOINT","S3_ACCESS_KEY_ID","S3_SECRET_ACCESS_KEY"]) console.log(`${k}=${process.env[k]}`)' > smoke.env
          docker run -d --name api --env-file smoke.env -e APP_ENV=test -e DATABASE_URL=postgres://rms_app:smoke@127.0.0.1:1/rms \
            -p 127.0.0.1:3001:3001 rms-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health/live; then echo; echo "up after ${i}s"; break; fi
            if [ "$i" = 30 ]; then docker logs api; exit 1; fi
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/health/ready)
          test "$code" = 503 || { echo "ready answered $code, expected 503 without a database"; docker logs api; exit 1; }
      # On `staging` the image that was scanned is handed to `publish`, which pushes it only when `gate` is green (DR-276).
      - if: github.ref == 'refs/heads/staging'
        run: docker save rms-api:ci | gzip -1 > rms-api.tar.gz
      - if: github.ref == 'refs/heads/staging'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rms-api-image
          path: rms-api.tar.gz
          retention-days: 1
          compression-level: 0

  e2e-web:
    needs: [changes, trusted]
    if: ${{ !cancelled() && needs.changes.outputs.e2e == 'true' && needs.trusted.outputs.e2e != 'passed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check:bundle # DOC-53 §8 budgets (DR-179)
      # The flows start their own database (a clone of the migrated template), the API and Vite; they need the three services of
      # `infra:up` (PostgreSQL, the object store, Mailpit). `seed:demo` is not used: each run seeds its own building (P1-16).
      - run: bun run keys:generate
      - run: bun run infra:up
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/cms-web
      - run: bun run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: apps/cms-web/test-results
          retention-days: 7

  # The one required check (DR-163). `e2e-web` is not in it: it gates the staging deploy, not a merge. GitHub Free has
  # no branch protection for a private repository, so `bun run pr:merge <n>` is what refuses a merge without it (DR-241).
  gate:
    if: always()
    needs: [changes, verify, unit, integration, security, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null
      - if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "gate is green; merge with \`bun run pr:merge $PR_NUMBER\` (DR-241)" >> "$GITHUB_STEP_SUMMARY"

  # Is there a staging host? Asked on a push to `staging` only (DR-276). The variable `HOST_IP` of the environment `staging` is its address (DOC-70 §11), so a non-empty value is
  # the answer (DR-275). A job's `if` cannot read an environment's variables, hence this job: it runs in the environment with
  # `deployment: false`, which gives it the variables and writes no deployment record. Until the host exists `publish` and
  # `deploy-staging` do not start, and no `failure` record is left on every push.
  staging-host:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment:
      name: staging
      deployment: false
    outputs:
      ready: ${{ steps.host.outputs.ready }}
    steps:
      - id: host
        env:
          HOST_IP: ${{ vars.HOST_IP }}
        run: |
          if [ -n "$HOST_IP" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No staging host yet (the variable HOST_IP of the environment staging is empty): nothing is published or deployed." >> "$GITHUB_STEP_SUMMARY"
          fi

  # `sha-<7>` reaches GHCR only for a commit pushed to `staging` whose `gate` is green (DOC-71 §7.5) and only when there is a staging host (DR-275, DR-276).
  publish:
    if: ${{ github.ref == 'refs/heads/staging' && needs.staging-host.outputs.ready == 'true' }}
    needs: [gate, staging-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rms-api-image
      - run: gunzip -c rms-api.tar.gz | docker load
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push sha-<7> to GHCR
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rms-api:sha-${GITHUB_SHA::7}"
          docker tag rms-api:ci "$image"
          docker push "$image"
          echo "pushed \`$image\`" >> "$GITHUB_STEP_SUMMARY"

  # DOC-71 §7.3: a push to `staging` whose `gate` is green and whose image is in GHCR deploys to staging, then the smoke test runs from
  # here against the public hosts. A deploy gate, not a merge gate (DR-163). The job's own deployment record is what `promote`
  # reads on a release tag (DOC-71 §7.4). Two deploys never overlap: the second waits for the first.
  deploy-staging:
    if: ${{ !cancelled() && github.ref == 'refs/heads/staging' && needs.staging-host.outputs.ready == 'true' && needs.publish.result == 'success' && needs.e2e-web.result != 'failure' }}
    needs: [publish, e2e-web, staging-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DOMAIN: ${{ vars.DOMAIN }}
      CLOUDFLARED_VERSION: 2026.10.1 # DOC-11 §7
      CLOUDFLARED_SHA256: 200573c872174ab449965655febadef8edfbb144ebcaa391b700b2dedbadb3cd # the .deb of that release, as its notes list it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cloudflared (checksum verified)
        run: |
          curl -fsSL -o cloudflared.deb "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
          echo "${CLOUDFLARED_SHA256}  cloudflared.deb" | sha256sum -c -
          sudo dpkg -i cloudflared.deb
          cloudflared --version
      # DR-273: nothing is prepared on the VPS by hand. `--prepare` builds the host from the inputs in GitHub (a no-op when its stamp
      # matches), the first run reaching it through HOST_IP; `--finish` does what needs the running stack, and closes the firewall.
      - name: Prepare the host (ops/host/bootstrap.sh)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          RMS_SECRETS_PACK: ${{ secrets.RMS_SECRETS_PACK }}
          HOST_IP: ${{ vars.HOST_IP }}
          HOST_INITIAL_USER: ${{ vars.HOST_INITIAL_USER }}
          RMS_DATA_DEVICE: ${{ vars.RMS_DATA_DEVICE }}
          OPERATOR_SSH_KEYS: ${{ vars.OPERATOR_SSH_KEYS }}
          RMS_APP_ENV_EXTRA: ${{ vars.RMS_APP_ENV_EXTRA }}
        run: ops/deploy/ci-deploy.sh staging --prepare
      - name: Deploy sha-<7> over the Tunnel
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HOST_IP: ${{ vars.HOST_IP }}
        run: |
          # `run` is `bash -e` without pipefail: the exit code of `tee` would hide a failed deploy, and the record would say success.
          set -o pipefail
          tag="sha-${GITHUB_SHA::7}"
          ops/deploy/ci-deploy.sh staging "$tag" | tee deploy.log
          tail -n 1 deploy.log | sed 's/^/### /' >> "$GITHUB_STEP_SUMMARY"
      - name: Finish the host (buckets, pgBackRest, firewall)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HOST_IP: ${{ vars.HOST_IP }}
          HOST_INITIAL_USER: ${{ vars.HOST_INITIAL_USER }}
        run: ops/deploy/ci-deploy.sh staging --finish
      - name: Smoke test (DOC-71 §7.3)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          STAGING_DEMO_PASSWORD: ${{ secrets.STAGING_DEMO_PASSWORD }}
        run: ops/deploy/smoke.sh staging
