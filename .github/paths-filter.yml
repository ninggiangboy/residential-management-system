# Path outputs of the `changes` job (DOC-71 §4.1); `e2e-web` and the mobile jobs read them.
api:
  - apps/api/**
  - modules/**
  - packages/core-*/**
  - packages/shared-types/**
  - packages/i18n-catalog/**
  - docker/**
  - ops/**
  - bun.lock
web:
  - apps/cms-web/**
  - packages/design-tokens/**
  - packages/i18n-catalog/**
  - packages/shared-types/**
  - packages/client-core/**
  - packages/core-web/**
  - bun.lock
mobile:
  - apps/resident-app/**
  - apps/staff-app/**
  - packages/mobile-core/**
  - packages/client-core/**
  - packages/ui-native/**
  - packages/design-tokens/**
  - packages/i18n-catalog/**
  - packages/shared-types/**
  - bun.lock
docs:
  - docs/**
