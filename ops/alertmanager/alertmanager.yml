# Alertmanager of staging and production (DOC-40 §6, DOC-70 §10). The addresses and the chat id are Owner input that DOC-70 §2 rows
# 11 and 12 collect before P1-20; until then they are placeholders that deliver nothing (DR-228). The secrets are files (DOC-70 §9.1).
global:
  smtp_smarthost: smtp.example.invalid:587
  smtp_from: rms-alerts@example.invalid
  smtp_auth_username: rms-alerts@example.invalid
  smtp_auth_password_file: /run/secrets/alertmanager-smtp-password
  smtp_require_tls: true

route:
  receiver: owner
  group_by: [alertname, env]
  routes:
    # Critical repeats until somebody silences it (acknowledgement is a silence, DR-155).
    - matchers: [severity="critical"]
      receiver: owner
      group_wait: 10s
      repeat_interval: 30m
    - matchers: [severity="warning"]
      receiver: owner
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h

# While the API or PostgreSQL is down, the warnings of the same environment are consequences.
inhibit_rules:
  - source_matchers: [alertname=~"ApiDown|PostgresDown|ReadinessFailing"]
    target_matchers: [severity="warning"]
    equal: [env]

receivers:
  - name: owner
    email_configs:
      - to: owner@example.invalid, admin@example.invalid
        send_resolved: true
    telegram_configs:
      - bot_token_file: /run/secrets/telegram-bot-token
        chat_id: 1
        send_resolved: true
