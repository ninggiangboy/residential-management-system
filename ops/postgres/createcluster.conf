# /etc/postgresql-common/createcluster.conf (DOC-70 §8.1): no default cluster, which would take the host's locale and the default
# listen address; `pg_createcluster 18 main --locale=C.UTF-8 --encoding=UTF8 -- --data-checksums` makes the real one.
create_main_cluster = false
add_include_dir = 'conf.d'
