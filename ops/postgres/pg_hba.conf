# /etc/postgresql/18/main/pg_hba.conf (DOC-19 §7, DOC-70 §8.3). PostgreSQL listens on the loopback and on the Docker bridge's
# gateway only (DR-83); the subnet is the network `rms` of DOC-70 §4.6.
# TYPE  DATABASE  USER                                ADDRESS            METHOD
local   all       postgres                                               peer
local   rms       rms_backup                                             peer map=backup
local   rms       rms_readonly,rms_migrator                              scram-sha-256
host    rms       rms_app,rms_migrator,rms_readonly   172.30.0.0/24      scram-sha-256
host    all       all                                 0.0.0.0/0          reject
host    all       all                                 ::/0               reject
