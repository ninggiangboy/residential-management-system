# /etc/postgresql/18/main/conf.d/rms.conf (DOC-70 §8.3), the part that is the same on every host. The memory and the number of
# connections are in `rms-staging.conf` or `rms-production.conf` (DR-06, DR-102), installed beside it.
listen_addresses = 'localhost,172.30.0.1'
port = 5432
password_encryption = scram-sha-256
timezone = 'UTC'
log_timezone = 'UTC'

work_mem = 8MB
maintenance_work_mem = 128MB
random_page_cost = 1.1

# WAL and the archive (DR-66: RPO <= 5 minutes)
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=rms archive-push %p'
archive_timeout = 60
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# diagnostics
log_min_duration_statement = 500
log_lock_waits = on
log_checkpoints = on
log_line_prefix = '%m [%p] %u@%d '
