# /etc/ssh/sshd_config.d/10-rms.conf (DOC-70 §4.4). sshd listens on every interface; what stops a connection from the Internet
# is the firewall of §4.8 and the provider's firewall. The listener must stay reachable from the Docker bridge, where `cloudflared`
# runs.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers deploy ops
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
ClientAliveInterval 60
ClientAliveCountMax 3
