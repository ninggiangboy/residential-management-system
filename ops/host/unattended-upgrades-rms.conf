// /etc/apt/apt.conf.d/52rms-unattended (DOC-70 §4.5): security updates of the operating system install themselves; PostgreSQL,
// pgBackRest and Docker never do, because a restart of the database or the daemon is a planned event.
Unattended-Upgrade::Allowed-Origins { "${distro_id}:${distro_codename}-security"; };
Unattended-Upgrade::Package-Blacklist { "postgresql-.*"; "pgbackrest"; "docker-.*"; "containerd.*"; };
Unattended-Upgrade::Automatic-Reboot "false";
