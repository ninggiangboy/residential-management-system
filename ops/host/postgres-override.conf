# /etc/systemd/system/postgresql@18-main.service.d/override.conf (DOC-70 §8.2). PostgreSQL listens on the Docker bridge's
# gateway, which exists only after Docker has started; OOMScoreAdjust keeps the kernel from choosing the database (DR-102).
[Unit]
After=docker.service
Wants=docker.service

[Service]
OOMScoreAdjust=-900
