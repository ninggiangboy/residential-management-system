<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 1100px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--ground); color: var(--ink); font-family: var(--font-sans);">

<main style="position: relative; flex-grow: 1; display: flex; flex-direction: column; gap: 24px; padding: 4px 20px 32px;">

<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px;">
<div style="font-size: 20px; line-height: 28px; font-weight: 600;">Đỗ Văn Hùng</div>
<div style="font-size: 14px; line-height: 20px; color: var(--ink-muted);">hung.do@mocmien.vn</div>

</x-import>
</x-import>

</div>

return {

{ key: 'jobs', icon: 'wrench', label: 'Công việc', badge: 2 },
{ key: 'history', icon: 'clock', label: 'Lịch sử' },
{ key: 'docs', icon: 'squares-four', label: 'Tài liệu' },

]
};
}
}
