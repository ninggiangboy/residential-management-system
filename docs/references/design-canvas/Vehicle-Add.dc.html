<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đăng ký phương tiện</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/hien/tokens.css">
<link rel="stylesheet" href="ds/hien/components/bundle.css">
<script src="ds/hien/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Geologica";src:url("/_blob/48538e6d390280452076b4ca60a952e0") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Geologica";src:url("/_blob/647a964de944ee39b7c47a99ea62b135") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Geologica";src:url("/_blob/19962546aec1b37d3c336b6071c843e0") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Geologica";src:url("/_blob/bcebc6a6ec6caf21308a4e7de8842749") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Big Shoulders";src:url("/_blob/80aa0a0b30ea0b3a3a522677b8c24ac9") format("woff2");font-weight:700;font-style:normal;font-display:swap}
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 1240px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--ground); color: var(--ink); font-family: var(--font-sans);">
<x-import component-from-global-scope="Hien.TopBar" title="Đăng ký phương tiện" subtitle="Căn hộ A-1508" on-back="{{noop}}"></x-import>
<main style="position: relative; flex-grow: 1; display: flex; flex-direction: column; gap: 24px; padding: 8px 20px 24px;">
<x-import component-from-global-scope="Hien.Banner" tone="info" title="Cần Ban quản lý duyệt">Phương tiện mới hoặc sửa thông tin đều chờ BQL duyệt. Bạn nhận thông báo khi có kết quả.</x-import>
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="font-size: 15px; line-height: 20px; font-weight: 600;">Loại xe</div>
<x-import component-from-global-scope="Hien.SegmentedControl" label="Loại xe" value="car" options="{{kinds}}" on-change="{{noop}}"></x-import>
</div>
<x-import component-from-global-scope="Hien.TextField" label="Biển số" value="30K-123.45" helper="Viết đúng như trên biển, ví dụ 30K-123.45." on-change="{{noop}}"></x-import>
<x-import component-from-global-scope="Hien.TextField" label="Hãng, màu xe" value="Toyota Vios, màu bạc" optional="{{yes}}" on-change="{{noop}}"></x-import>
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="font-size: 15px; line-height: 20px; font-weight: 600;">Ảnh xe</div>
<x-import component-from-global-scope="Hien.AttachmentPicker" items="{{carPhotos}}" max="{{three}}" add-label="Chụp ảnh xe" on-add="{{noop}}" on-remove="{{noop}}"></x-import>
<div style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">Chụp thấy rõ biển số.</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="font-size: 15px; line-height: 20px; font-weight: 600;">Ảnh giấy đăng ký xe</div>
<x-import component-from-global-scope="Hien.AttachmentPicker" items="{{none}}" max="{{two}}" add-label="Chụp giấy đăng ký" on-add="{{noop}}" on-remove="{{noop}}"></x-import>
<div style="font-size: 13px; line-height: 18px; color: var(--danger);">Cần ảnh giấy đăng ký xe, chụp rõ cả hai mặt.</div>
</div>
</main>
<div style="position: relative; flex-shrink: 0; padding: 12px 20px 32px;">
<x-import component-from-global-scope="Hien.Button" variant="primary" size="lg" block="{{yes}}" on-click="{{noop}}">Gửi đăng ký</x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.theme ?? 'light',
yes: true,
two: 2,
three: 3,
none: [],
carPhotos: [{ name: 'xe-truoc.jpg' }],
kinds: [{ value: 'car', label: 'Ô tô' }, { value: 'motorcycle', label: 'Xe máy' }, { value: 'ebike', label: 'Xe điện' }],
noop: function () {}
};
}
}
</script>
</body>
</html>
