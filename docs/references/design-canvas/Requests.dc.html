<style>

<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 1160px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--ground); color: var(--ink); font-family: var(--font-sans);">
<x-import component-from-global-scope="Hien.Glow"></x-import>
<main style="position: relative; flex-grow: 1; display: flex; flex-direction: column; gap: 8px; padding: 4px 0 24px;">
<x-import component-from-global-scope="Hien.TopBar" variant="large" title="Yêu cầu hỗ trợ" subtitle="Căn hộ A-1508">
<x-import component-from-global-scope="Hien.IconButton" icon="bell" label="Thông báo, 4 mục chưa đọc" variant="filled" count="{{unread}}" on-click="{{noop}}"></x-import>
</x-import>
<div style="display: flex; flex-direction: column; gap: 16px; padding: 0 20px;">
<x-import component-from-global-scope="Hien.Tabs" label="Trạng thái yêu cầu" value="open" items="{{tabsStatus}}" on-change="{{noop}}"></x-import>
<x-import component-from-global-scope="Hien.TicketCard" code="YC-1007-012" title="Điều hòa phòng ngủ chảy nước xuống sàn" category="Sửa chữa" time="gửi 08:30, 07/10" status="processing" on-click="{{noop}}"></x-import>
<x-import component-from-global-scope="Hien.TicketCard" code="YC-1009-007" title="Ổ cắm phòng khách có mùi khét" category="Sửa chữa" time="gửi 07:55, 09/10" status="sent" on-click="{{noop}}"></x-import>
<x-import component-from-global-scope="Hien.TicketCard" code="YC-1005-020" title="Xe lạ đỗ chắn lối vào ô đỗ B1-042" category="An ninh" time="gửi 21:15, 05/10" status="received" on-click="{{noop}}"></x-import>
</div>
</main>
<div style="position: relative; flex-shrink: 0; padding: 0 20px 20px;">
<x-import component-from-global-scope="Hien.Button" variant="primary" size="lg" icon="plus" block="{{yes}}" on-click="{{noop}}">Tạo yêu cầu</x-import>
</div>
<div style="position: relative; flex-shrink: 0;">
<x-import component-from-global-scope="Hien.TabBar" value="requests" items="{{tabs}}" center="{{centerAction}}"></x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1160}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.theme ?? 'light',
yes: true,
unread: 4,
noop: function () {},
tabsStatus: [
{ key: 'open', label: 'Đang mở', count: 3 },
{ key: 'done', label: 'Hoàn thành' },
{ key: 'cancelled', label: 'Đã hủy' }
],
centerAction: { icon: 'qr-code', label: 'Mã QR ra vào của tôi' },
tabs: [
{ key: 'home', icon: 'house', label: 'Trang chủ' },
{ key: 'fees', icon: 'receipt', label: 'Phí', badge: 2 },
{ key: 'requests', icon: 'chat-circle-dots', label: 'Yêu cầu' },
{ key: 'unit', icon: 'buildings', label: 'Căn hộ' }
]
};
}
}
</script>
