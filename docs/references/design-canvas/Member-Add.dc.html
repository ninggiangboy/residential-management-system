<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 1100px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--ground); color: var(--ink); font-family: var(--font-sans);">

</x-import>

<p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted);">Nếu số điện thoại đã có tài khoản ở căn khác, hệ thống liên kết thêm căn A-1508 vào tài khoản đó, không tạo tài khoản mới.</p>
