[install]
# Metro and Vite resolve through node_modules; the isolated linker of Bun 1.3+ hides workspace packages from Metro (DOC-11 §10 row 1)
linker = "hoisted"
# Resolve only versions published at least 7 days ago (DR-242): a compromised release is usually pulled within days.
# A locked version is not checked again. A fix for a HIGH or CRITICAL advisory goes into `minimumReleaseAgeExcludes` by
# package name (DR-316) with a comment that lists the advisories and a removal date; Bun 1.4.3 ignores the `name@version` form.
minimumReleaseAge = 604800
# node-forge 1.4.2 (2026-10-27) fixes five HIGH CVEs found by Trivy (CVE-2026-118779, -118782, -119187, -119188, -119190).
# Remove this entry on 2026-11-03, when the version is 7 days old.
minimumReleaseAgeExcludes = ["node-forge"]
