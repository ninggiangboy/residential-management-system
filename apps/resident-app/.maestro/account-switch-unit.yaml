# UIRQ-01, UIRQ-02, UIRA-43, CL-24: switching homes drops the previous home's cached data; nothing of A-1508 shows under A-0703.
appId: vn.rms.resident.dev
---
- runFlow: helpers/launch.yaml
- tapOn:
    id: phone-input
- inputText: "0901 234 567"
# Enter on the keyboard sends the number like the button; `hideKeyboard` finds nothing to press on iOS.
- pressKey: Enter
- extendedWaitUntil:
    visible: "Enter the OTP"
    timeout: 30000
- inputText: "123456"
- tapOn:
    id: unit-A-1508
- runFlow: helpers/dismiss-push-prompt.yaml
- tapOn:
    id: open-account
# A row is one element for the accessibility tree: "A-1508. Owner, selected".
- assertVisible: ".*Owner, selected.*"
- tapOn:
    id: account-unit-A-0703
- assertVisible:
    id: home-screen
- assertVisible: ".*A-0703.*"
- assertNotVisible: ".*A-1508.*"
