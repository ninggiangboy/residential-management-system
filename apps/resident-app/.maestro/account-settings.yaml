# UIRQ-03: the language is saved on the account and kept after the app restarts.
appId: vn.rms.resident.dev
---
- runFlow: helpers/launch.yaml
- tapOn:
    id: phone-input
- inputText: "+12025550102"
# Enter on the keyboard sends the number like the button; `hideKeyboard` finds nothing to press on iOS.
- pressKey: Enter
- extendedWaitUntil:
    visible: "Enter the OTP"
    timeout: 30000
- inputText: "123456"
- runFlow: helpers/accept-terms.yaml
- runFlow: helpers/dismiss-push-prompt.yaml
- tapOn:
    id: open-account
- tapOn:
    id: account-language
- tapOn:
    id: language-vi
- assertVisible: "Tài khoản"
- stopApp
- runFlow: helpers/reopen.yaml
- assertVisible: "Tài khoản"
