# UIRA-14, UIRA-20: a wrong code clears the input and shows the tries left; "Change phone number" returns with the phone kept.
appId: vn.rms.resident.dev
---
- runFlow: helpers/launch.yaml
- tapOn:
    id: phone-input
- inputText: "+12025550104"
# Enter on the keyboard sends the number like the button; `hideKeyboard` finds nothing to press on iOS.
- pressKey: Enter
- extendedWaitUntil:
    visible: "Enter the OTP"
    timeout: 30000
- inputText: "654321"
- assertVisible: "Wrong code. 4 tries left."
- tapOn:
    id: otp-change-phone
- assertVisible: "Sign in"
- assertVisible: "+12025550104"
