# The development client opens on Expo's server picker after a clear state; this opens the Metro server of `bun run rapp` (port 8081)
# and waits for the first screen. A production or staging build has no picker, and its flows start with `launchApp` alone.
appId: vn.rms.resident.dev
---
# `clearState` leaves the iOS keychain alone, where the secure store keeps the session; without this a flow that starts after a
# sign-in opens on Home, not on the sign-in screen.
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
- launchApp:
    clearState: true
# The link is only taken when the launcher is up; sent at once after the launch it is dropped and the run stays on the server list.
- extendedWaitUntil:
    visible: "DEVELOPMENT SERVERS"
    timeout: 30000
    optional: true
- openLink: exp+rms-resident://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&disableOnboarding=1
# iOS asks before it hands the link to the app.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
# On Android the link may leave the launcher on its list of servers; the one server of `bun run rapp`/`sapp` is picked from it.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "http://.*:808[12]"
          timeout: 30000
          optional: true
      - tapOn:
          text: "http://.*:808[12]"
          optional: true
      # The development client's introduction sheet covers the app and takes its input; it opens a moment after the app does.
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 20000
          optional: true
      - tapOn:
          text: "Continue"
          optional: true
      # Then the tools menu opens over the app. Its floating tools button sits on the top-right corner and takes the taps meant for a
      # button there (the language switch, the account button), so the menu turns the button off before Back closes it (only when the
      # menu is open, or Back would leave the app). The setting is kept in the app's data, which `clearState` wipes, so it is set on every launch.
      - extendedWaitUntil:
          visible: "Toggle performance monitor"
          timeout: 8000
          optional: true
      - runFlow:
          when:
            visible: "Toggle performance monitor"
          commands:
            - scrollUntilVisible:
                element: "Tools button"
            - tapOn: "Tools button"
            - pressKey: back
- extendedWaitUntil:
    visible:
      id: "phone-input"
    timeout: 60000
# On iOS the first touch after a launch does not focus a field, and the text of the next `inputText` is lost with no error;
# this one is spent here so that the tap a flow makes on the same field takes.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "phone-input"
# iOS opens no menu of its own, and the tools button (top-right corner) covers the language switch and the account button, so the
# menu is opened with that button, the button is turned off and the menu is closed with its X (`xmark`). The setting is lost with `clearState`.
- runFlow:
    when:
      platform: iOS
    commands:
      # The button is drawn a moment after the screen, and a tap before that reaches nothing; so the open is tried again.
      - retry:
          maxRetries: 2
          commands:
            - tapOn:
                point: "91%,10%"
            - extendedWaitUntil:
                visible: "Toggle performance monitor"
                timeout: 6000
      - scrollUntilVisible:
          element: "Tools button"
      # A tap on the label or `rightOf` does nothing on iOS, only one on the switch itself; after the scroll the sheet is
      # always open to the same height, so the switch of the row is where this point is.
      - tapOn:
          point: "85%,67%"
      - tapOn:
          id: "xmark"
      # The menu slides down and the button goes with it; a tap in the corner before that opens the menu again.
      - extendedWaitUntil:
          notVisible: "Toggle performance monitor"
          timeout: 5000
      - waitForAnimationToEnd:
          timeout: 3000
