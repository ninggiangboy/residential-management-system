# UIRA-33, UIRA-34: two homes go to Unit-Pick in unit-code order; the tenant card says whether paying is allowed.
# Account +84901234567: owner of A-1508 and tenant (cannot pay) of A-0703.
appId: vn.rms.resident.dev
---
- runFlow: helpers/launch.yaml
- tapOn:
    id: phone-input
- inputText: "0901 234 567"
# Enter on the keyboard sends the number like the button; `hideKeyboard` finds nothing to press on iOS.
- pressKey: Enter
- extendedWaitUntil:
    visible: "Enter the OTP"
    timeout: 30000
- inputText: "123456"
- assertVisible: "Choose a home"
# A card is one element for the accessibility tree: "A-0703, Tenant, Not allowed to pay fees".
- assertVisible: ".*Not allowed to pay fees.*"
- tapOn:
    id: unit-A-1508
- runFlow: helpers/dismiss-push-prompt.yaml
- assertVisible:
    id: home-screen
# The unit switcher of Home is one element: "A-1508. You are the owner".
- assertVisible: ".*A-1508.*"
