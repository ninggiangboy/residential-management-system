# UIRQ-07: signing out clears the session and returns to Login; the sessions list shows this device first.
appId: vn.rms.resident.dev
---
- runFlow: helpers/launch.yaml
- tapOn:
    id: phone-input
- inputText: "+12025550103"
# Enter on the keyboard sends the number like the button; `hideKeyboard` finds nothing to press on iOS.
- pressKey: Enter
- extendedWaitUntil:
    visible: "Enter the OTP"
    timeout: 30000
- inputText: "123456"
- runFlow: helpers/accept-terms.yaml
- runFlow: helpers/dismiss-push-prompt.yaml
- tapOn:
    id: open-account
- tapOn:
    id: account-sessions
- assertVisible: "This device"
# The `back` command exists on Android only; the back button of the top bar is named "Back" on both.
- tapOn: "Back"
# The row is below the fold of the Account screen; a tap on an element that is out of view reaches nothing on iOS.
- scrollUntilVisible:
    element:
      id: sign-out
- tapOn:
    id: sign-out
- tapOn:
    id: signout-confirm
- assertVisible: "Sign in"
