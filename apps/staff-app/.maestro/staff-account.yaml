# UISM-14, UISM-15, UISM-16, UISM-18: edit the name with If-Match, switch the language, open the sessions view, sign out.
appId: vn.rms.staff.dev
---
- runFlow: helpers/launch.yaml
- tapOn:
    id: email-input
- inputText: "technician@demo.rms.invalid"
# "Next" on the keyboard moves to the password; with the keyboard up, that field is out of view and a tap on it reaches the footer.
- pressKey: Enter
- inputText: "demo-password-1"
# Enter on the keyboard sends the form like the button; `hideKeyboard` taps a spot of its own on iOS and hit "Forgot password".
- pressKey: Enter
- runFlow: helpers/dismiss-save-password.yaml
- tapOn:
    id: edit-profile
- tapOn:
    id: name-input
- eraseText
- inputText: "Phạm Văn Kỹ Thuật"
# Enter on the keyboard saves like the button; a tap on Save right after the typing reaches where it was while the sheet rises.
- pressKey: Enter
- assertVisible: "Phạm Văn Kỹ Thuật"
- tapOn:
    id: account-language
- tapOn:
    id: language-vi
- assertVisible: "Tài khoản"
- tapOn:
    id: account-sessions
- assertVisible: "Thiết bị này"
# The `back` command exists on Android only; the back button of the top bar is named by the language of the app here (Vietnamese).
- tapOn: "Quay lại"
# The row is below the fold of the Account screen; a tap on an element that is out of view reaches nothing on iOS.
- scrollUntilVisible:
    element:
      id: sign-out
- tapOn:
    id: sign-out
- tapOn:
    id: signout-confirm
- assertVisible: "Đăng nhập"
