# iOS asks "Save Password?" when the sign-in form leaves the screen with a password in it; the sheet covers the app and takes
# its taps, so a flow closes it right after a sign-in that succeeds. It is not there on Android or after a failed sign-in.
appId: vn.rms.staff.dev
---
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 5000
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
