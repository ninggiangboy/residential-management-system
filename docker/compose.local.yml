# Local infrastructure (DOC-69 §6): PostgreSQL, an S3-compatible object store and Mailpit.
# Started by `bun run infra:up`; every value below comes from .env.local (bun run keys:generate).
# Ports are published on 127.0.0.1 only: nothing here has real credentials, and a LAN host must not reach it.
# `RMS_STACK` (default `rms`) names the Compose project and the two volumes: a second clone beside a working copy sets it in
# its `.env.local` (and the ports, DOC-69 §14.1), or it would share the other stack's database and files.
name: ${RMS_STACK:-rms}

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${RMS_POSTGRES_PASSWORD:?run bun run keys:generate}
      RMS_MIGRATOR_PASSWORD: ${RMS_MIGRATOR_PASSWORD:?run bun run keys:generate}
      RMS_APP_PASSWORD: ${RMS_APP_PASSWORD:?run bun run keys:generate}
      RMS_READONLY_PASSWORD: ${RMS_READONLY_PASSWORD:?run bun run keys:generate}
    ports:
      - 127.0.0.1:${RMS_PG_PORT:-5432}:5432
    volumes:
      - rms-pg:/var/lib/postgresql
      - ./postgres/init/10-provision.sh:/docker-entrypoint-initdb.d/10-provision.sh:ro
      - ../ops/postgres/0001-provision.sql:/provision/0001-provision.sql:ro
    healthcheck:
      # TCP on purpose: during the first start the temporary server only listens on the socket, so the check
      # cannot pass before the provisioning script has finished.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d rms']
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s

  objectstore:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -filer -volume.max=8 -master.volumeSizeLimitMB=512
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?run bun run keys:generate}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run bun run keys:generate}
    ports:
      - 127.0.0.1:${RMS_S3_PORT:-9000}:8333 # S3 API
      - 127.0.0.1:${RMS_S3_CONSOLE_PORT:-9001}:8888 # filer: browse the buckets
    volumes:
      - rms-s3:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8333/healthz']
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 3s

  # One-shot: creates the bucket and its CORS rule, then exits 0. Safe to run again.
  objectstore-init:
    image: amazon/aws-cli:2.39.3
    depends_on:
      objectstore:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        s3="aws --endpoint-url http://objectstore:8333"
        $$s3 s3api head-bucket --bucket rms-local-files 2>/dev/null || $$s3 s3api create-bucket --bucket rms-local-files
        $$s3 s3api put-bucket-cors --bucket rms-local-files --cors-configuration '{"CORSRules":[{"AllowedOrigins":["http://localhost:5173"],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3000}]}'
        echo "bucket rms-local-files ready"
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.33.0
    environment:
      # Do not reverse-DNS the SMTP client: slow by default on Docker Desktop and OrbStack.
      MP_SMTP_DISABLE_RDNS: 'true'
    ports:
      - 127.0.0.1:${RMS_MAIL_PORT:-1025}:1025 # SMTP
      - 127.0.0.1:${RMS_MAIL_UI_PORT:-8025}:8025 # web UI
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

  # --- The monitoring stack of DOC-40 (profile `monitoring`, `bun run monitor:up`): the same configuration files as staging, with the
  # API on the host as the scrape target and Mailpit in place of the SMTP relay. Ports are on 127.0.0.1 only.
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --enable-feature=expand-external-labels
    environment:
      RMS_ENV: local
    # `bun run --filter @app/api dev` listens on OPS_PORT (3001) of the host and holds both roles, so one process answers for
    # `api-1` and `worker`; `api-2` stays unresolved and shows as a down target, as on staging.
    extra_hosts:
      - api-1:host-gateway
      - worker:host-gateway
    ports:
      - 127.0.0.1:${RMS_PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ../ops/prometheus:/etc/prometheus:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9090/-/ready']
      interval: 2s
      timeout: 3s
      retries: 30

  alertmanager:
    profiles: [monitoring]
    image: prom/alertmanager:v0.34.2
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    depends_on:
      mailpit:
        condition: service_healthy
    ports:
      - 127.0.0.1:${RMS_ALERTMANAGER_PORT:-9093}:9093
    volumes:
      - ../ops/alertmanager/alertmanager.local.yml:/etc/alertmanager/alertmanager.yml:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9093/-/ready']
      interval: 2s
      timeout: 3s
      retries: 30

  # The two exporters of DOC-70 §6.1, so that the jobs `postgres` and `node` of the shared Prometheus file have targets here too (the
  # same images as staging). On Docker Desktop and OrbStack `node-exporter` reports the Linux VM, not the Mac.
  postgres-exporter:
    profiles: [monitoring]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgres://rms_readonly:${RMS_READONLY_PASSWORD:?run bun run keys:generate}@postgres:5432/rms?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  node-exporter:
    profiles: [monitoring]
    image: prom/node-exporter:v1.12.1
    command: --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  loki:
    profiles: [monitoring]
    image: grafana/loki:3.7.9
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ../ops/loki:/etc/loki:ro
    # No healthcheck: the image has no shell tools. Alloy retries its pushes until Loki answers.

  # Reads the logs of the containers of this project. The API on the host writes to its terminal, so locally only the containers
  # (and the image of `docker/Dockerfile.api`, when run in this project) reach Loki.
  alloy:
    profiles: [monitoring]
    image: grafana/alloy:v1.21.3
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    environment:
      RMS_ENV: local
    depends_on:
      - loki
    volumes:
      - ../ops/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.3.0
    environment:
      # Local only: no sign-in. Staging and production keep the sign-in behind Cloudflare Access (DR-88).
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - 127.0.0.1:${RMS_GRAFANA_PORT:-3030}:3000
    volumes:
      - ../ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/api/health']
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  rms-pg:
    name: ${RMS_STACK:-rms}-pg
  rms-s3:
    name: ${RMS_STACK:-rms}-s3
